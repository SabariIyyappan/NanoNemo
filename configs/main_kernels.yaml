# Main run with our kernels: configs/main.yaml (which trained the released model) plus the S6 kernel stack, validated
# in DDP on 2x T4 (configs/kernels/): a 100M-token run's val loss stays within 0.03 of the plain run at every evaluation
# (0.018 at the end). Speed in DDP was within Kaggle's thermal drift of plain DDP; single-T4 S6 is 1.05x over S3.
# Only the lines marked "<-" differ from main.yaml. Same launch command as main.yaml.
model:
  attn_backend: mem_efficient
  norm_kernel: cuda      # <-
  swiglu_kernel: triton  # <-
  rope_kernel: triton    # <-
train:
  data_dir: data/nemotron_cc
  out_dir: runs/main_kernels
  seq_len: 1024
  micro_batch: 4
  global_batch_tokens: 524288
  total_tokens: 2415000000     # the M1 train split (2,415,765,275 tokens): one epoch
  warmup_frac: 0.02
  peak_lr: 3.0e-4              # M7 LR sweep winner: val loss 5.78 at 100M tokens (6e-4: 5.94, 1.2e-3: 6.17)
  precision: fp16
  compile: default
  parallel: ddp                # M7 table: fastest 2-GPU row (~33.5k tok/s; FSDP ~27.8k, TP ~19.2k)
  ddp_bucket_mb: 100
  ddp_grad_as_bucket_view: true
  eval_every: 250
  eval_batches: 40
  log_every: 10
  ckpt_every: 250              # ~1 checkpoint per 40-60 min on 2x T4
