# M7 LR sweep: short runs (100M tokens, ~190 steps of 0.5M tokens) on 2x T4 with DDP, one per
# peak LR; the main run (M9) uses the LR with the lowest val loss at the end.
#   torchrun --nproc_per_node=2 scripts/train.py --config configs/lr_sweep/lr_6.0e-4.yaml --set train.data_dir=...
model:
  attn_backend: mem_efficient
train:
  data_dir: data/nemotron_cc
  out_dir: runs/lr_sweep/lr_6.0e-4
  seq_len: 1024
  micro_batch: 4
  global_batch_tokens: 524288
  total_tokens: 100000000
  warmup_frac: 0.05
  peak_lr: 6.0e-4
  precision: fp16
  compile: default
  parallel: ddp
  eval_every: 25
  eval_batches: 40
  log_every: 5
