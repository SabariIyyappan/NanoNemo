# S5: + our fused Triton kernels (residual add + RMSNorm, SwiGLU, RoPE on Q and K), each a
# torch.library custom op, so torch.compile and CUDA graphs treat it as one opaque kernel.
# Same benchmark settings as s0_fp32.yaml; only the lines marked "<-" differ from the previous stage.
model:
  attn_backend: mem_efficient
  norm_kernel: triton    # <-
  swiglu_kernel: triton  # <-
  rope_kernel: triton    # <-
train:
  data_dir: data/nemotron_cc
  seq_len: 1024
  micro_batch: 2          # micro 2 for every stage: the ladder compares at a fixed micro-batch
  global_batch_tokens: 16384
  peak_lr: 6.0e-4
  precision: fp16
  compile: reduce-overhead
