model:
  n_layers: 12
  d_model: 768
  n_heads: 12
  n_kv_heads: 4
  d_ff: 2048
  vocab_size: 50304
  max_seq_len: 1024
  norm_eps: 1.0e-05
  rope_base: 10000.0
  init_std: 0.02
  attn_backend: mem_efficient
  norm_kernel: torch
  swiglu_kernel: torch
  rope_kernel: torch
  attn_kernel: torch
  loss_kernel: torch
  linear_impl: torch
train:
  data_dir: /kaggle/input/datasets/sabariiyyappand/nanonemo-nemotron-cc
  out_dir: /kaggle/working/main
  seed: 0
  seq_len: 1024
  micro_batch: 4
  global_batch_tokens: 524288
  total_tokens: 2415000000
  peak_lr: 0.0003
  min_lr_ratio: 0.1
  warmup_frac: 0.02
  weight_decay: 0.1
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 40
  log_every: 10
  precision: fp16
  fp8_recipe: delayed
  compile: default
  wandb_project: null
  wandb_run_name: null
  parallel: ddp
  ddp_bucket_mb: 100
  ddp_grad_as_bucket_view: true
  fsdp_param_dtype: fp32
  fsdp_reshard_after_forward: true
  fsdp_prefetch: false
  fsdp_compile_blocks: false
  ckpt_every: 250
  ckpt_dir: null
  ckpt_async: true
  resume_from: /kaggle/input/nanonemo-main-ckpt
  stop_after_min: 640
  max_steps: null
