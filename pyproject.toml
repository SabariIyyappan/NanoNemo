[project]
name = "nanonemo"
version = "0.1.0"
description = "A ~125M Llama-style LM pretrained from scratch, and its training made fast on NVIDIA GPUs."
requires-python = ">=3.10"
# torch and triton come from the NGC container (or Kaggle's image); not pinned here.
dependencies = ["tiktoken", "wandb", "pyyaml", "zstandard", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanonemo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "multigpu: needs 2+ CUDA GPUs",
    "distributed: multi-process (torchrun) tests on the CPU with gloo; slow",
]
